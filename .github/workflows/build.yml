name: Build Windows EXE

on:
  push:
    branches: [ "main" ] # Roda sempre que você enviar código para a branch main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar dependências (psutil e pyinstaller)
      run: |
        python -m pip install --upgrade pip
        pip install psutil pyinstaller

    - name: Compilar o executável
      run: |
        pyinstaller --onefile --windowed benchmark.py

    - name: Disponibilizar o .exe para Download
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-windows-exe
        path: dist/benchmark.exe
